[package]
name = "secureintent-shadow-host"
version = "1.0.0"
edition = "2024"
description = "Native Messaging broker and detached scanner daemon for SecureIntent Shadow Upload"
publish = false
default-run = "secureintent-shadow-host"

[[bin]]
name = "secureintent-shadow-host"
path = "src/main.rs"

[[bin]]
name = "secureintent-shadow-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "secureintent-shadow-tauri"
path = "src/bin/tauri_host.rs"
required-features = ["tauri-host"]

[features]
default = []
tauri-host = ["dep:tauri", "dep:tauri-build"]

[dependencies]
base64 = "0.22"
libc = "0.2"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true }
thiserror = "2"
zeroize = "1"

[build-dependencies]
tauri-build = { version = "2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
